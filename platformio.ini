[env:wemos_d1_mini32]
platform = espressif32
board = wemos_d1_mini32
board_build.partitions = min_spiffs.csv
framework = arduino

monitor_speed = 115200
upload_speed = 921600
upload_port = COM7
monitor_port = COM7

extra_scripts =
    pre:scripts/increment-version.py
    post:scripts/copy-bin.py

build_flags =
    -DCORE_DEBUG_LEVEL=0
    -w
    -Os
    -g0
    -fdata-sections
    -ffunction-sections
    -Wl,--gc-sections

lib_extra_dirs =
    P:\Andy\Repos\Libs\Private
    P:\Andy\Repos\Libs\External